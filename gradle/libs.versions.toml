[bundles]
room = ["androidx-room-runtime", "androidx-room-ktx"]
compose = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3"]
mozilla = ["mozilla-browser-engine-gecko", "mozilla-browser-icons", "mozilla-browser-session-storage", "mozilla-browser-state", "mozilla-browser-storage-sync", "mozilla-browser-thumbnails", "mozilla-concept-base", "mozilla-concept-engine", "mozilla-concept-fetch", "mozilla-concept-storage", "mozilla-concept-toolbar", "mozilla-feature-addons", "mozilla-feature-contextmenu", "mozilla-feature-downloads", "mozilla-feature-prompts", "mozilla-feature-search", "mozilla-feature-session", "mozilla-feature-sitepermissions", "mozilla-feature-tabs", "mozilla-lib-state", "mozilla-service-location", "mozilla-support-base", "mozilla-support-ktx", "mozilla-support-utils", "mozilla-support-webextensions"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
